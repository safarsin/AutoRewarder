name: AutoRewarder Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  linting:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip

        # delete PyGObject and PySide6 from requirements.txt to avoid installation issues
        sed -i '/PyGObject/d' requirements.txt
        sed -i '/PySide6/d' requirements.txt

        pip install -r requirements-dev.txt

    # pep8, code formatting, and type checking
    - name: Run Black
      run: |
        black . --check

    # linting
    - name: Run Flake8
      run: |
        flake8 .

    # type checking
    - name: Run MyPy
      run: |
        mypy .
